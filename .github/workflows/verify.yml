name: verify

on:
  pull_request:

permissions:
  contents: read

jobs:
  swift-build-and-contracts:
    name: Swift build and contract harness
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Report SwiftPM host
        run: |
          sw_vers
          swift --version
          xcode-select -p
      - name: Swift build
        run: swift build
      - name: Menu-bar app product build
        run: swift build --product Oigo
      - name: Dependency-free contract harness
        run: swift run oigo-spike-contract-tests
      - name: Issue three contract harness
        run: swift run oigo-issue3-contract-tests
      - name: Issue four durable capture contract harness
        run: swift run oigo-issue4-contract-tests
      - name: Issue five transcription contract harness
        run: swift run oigo-issue5-contract-tests
      - name: Issue six raw insertion contract harness
        run: swift run oigo-issue6-contract-tests
